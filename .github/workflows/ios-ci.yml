name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test iOS package
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DERIVED_DATA_PATH: .build/ci-derived-data
      SOURCE_PACKAGES_PATH: .build/source-packages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          echo "xcode-version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES_PATH }}
          key: ios-spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode-version }}-

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme IDDigitalSDK \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list > /dev/null
          UDID="$(
            xcrun simctl list devices available -j |
              jq -r '[.devices[][] | select(.name | test("^iPhone"))][0].udid // empty'
          )"
          if [[ -z "$UDID" ]]; then
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run SDK tests
        run: |
          xcodebuild test \
            -scheme IDDigitalSDK \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES
