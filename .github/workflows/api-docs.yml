name: API documentation

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Evita cancelar un docbuild largo cuando llegan pushes seguidos (el fix del
# tarball en main se canceló a mitad de resolve y nunca se validó).
concurrency:
  group: api-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docc:
    name: Generate DocC HTML
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DERIVED_DATA_PATH: .build/docc-derived-data
      SOURCE_PACKAGES_PATH: .build/source-packages
      DOCS_OUTPUT_PATH: build/docc/html
      DOCS_TARBALL: iddigital-ios-api-docs.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Apple toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          echo "xcode-version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package checkouts
        uses: actions/cache@v5
        with:
          path: ${{ env.SOURCE_PACKAGES_PATH }}
          key: ios-spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode-version }}-

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme IDDigitalSDK \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -scheme IDDigitalSDK \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Transform DocC archive to static HTML
        shell: bash
        run: |
          set -euo pipefail
          DOCC_ARCHIVE="$(find "$DERIVED_DATA_PATH" -type d -name 'IDDigitalSDK.doccarchive' | head -n 1)"
          if [[ -z "$DOCC_ARCHIVE" || ! -d "$DOCC_ARCHIVE" ]]; then
            echo "DocC archive not found under $DERIVED_DATA_PATH"
            find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Using DocC archive at $DOCC_ARCHIVE"
          mkdir -p "$DOCS_OUTPUT_PATH"
          xcrun docc process-archive transform-for-static-hosting \
            "$DOCC_ARCHIVE" \
            --output-path "$DOCS_OUTPUT_PATH"
          test -f "$DOCS_OUTPUT_PATH/documentation/iddigitalsdk/index.html"

      # DocC genera paths con ":" (p. ej. `!=(_:_:).json` y firmas Swift), que
      # upload-artifact rechaza. Subimos un único tarball.
      - name: Package API documentation
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$DOCS_TARBALL" -C "$DOCS_OUTPUT_PATH" .
          test -s "$DOCS_TARBALL"
          ls -lh "$DOCS_TARBALL"
          # Confirmar que el artefacto a subir no tiene caracteres inválidos
          # (el contenido interno sí puede tener ":", por eso va empaquetado).
          case "$DOCS_TARBALL" in
            *[:\"\<\>\|\*\?]*) echo "Invalid artifact filename: $DOCS_TARBALL"; exit 1 ;;
          esac

      - name: Upload API documentation
        uses: actions/upload-artifact@v5
        with:
          name: iddigital-ios-api-docs-${{ github.sha }}
          path: ${{ env.DOCS_TARBALL }}
          if-no-files-found: error
          retention-days: 14
