name: API documentation

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docc:
    name: Generate DocC HTML
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DERIVED_DATA_PATH: .build/docc-derived-data
      SOURCE_PACKAGES_PATH: .build/source-packages
      DOCS_OUTPUT_PATH: build/docc/html

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          echo "xcode-version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_PACKAGES_PATH }}
          key: ios-spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-xcode-${{ steps.toolchain.outputs.xcode-version }}-

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme IDDigitalSDK \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -scheme IDDigitalSDK \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Transform DocC archive to static HTML
        shell: bash
        run: |
          set -euo pipefail
          DOCC_ARCHIVE="$DERIVED_DATA_PATH/Build/Products/Debug-iphoneos/IDDigitalSDK.doccarchive"
          if [[ ! -d "$DOCC_ARCHIVE" ]]; then
            echo "DocC archive not found at $DOCC_ARCHIVE"
            exit 1
          fi
          mkdir -p "$DOCS_OUTPUT_PATH"
          xcrun docc process-archive transform-for-static-hosting \
            "$DOCC_ARCHIVE" \
            --output-path "$DOCS_OUTPUT_PATH"

      - name: Upload API documentation
        uses: actions/upload-artifact@v4
        with:
          name: iddigital-ios-api-docs-${{ github.sha }}
          path: build/docc/html
          if-no-files-found: error
          retention-days: 14
